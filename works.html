<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Works — Arisa Teriyapirom</title>
  <style>
    :root {
      --bg: #f5f5f2;
      --text: #1f1f1f;
      --muted: #77736d;
      --line: #d8d1c7;
      --blue: #1d56cf;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      width: 100%;
      display: block;
      object-fit: cover;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10;
      padding: 24px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(247, 244, 238, 0.82);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(216, 209, 199, 0.5);
    }

    .logo,
    nav a {
      color: var(--blue);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
    }

    nav {
      display: flex;
      gap: 28px;
    }

    main {
      padding-top: 58px;
    }

    section {
      min-height: calc(100vh - 80px);
      padding: 44px 40px 90px;
    }

    .section-header {
      display: flex;
      align-items: flex-end;
      gap: 28px;
      padding-top: 8px;
    }

    h1 {
      font-family: Georgia, 'Times New Roman', serif;
      color: var(--blue);
      font-size: clamp(42px, 6vw, 82px);
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: -0.04em;
    }

    .section-note {
      max-width: 420px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.25;
      transform: translateY(-12px);
    }

    .work-grid {
      min-height: 62vh;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 80px;
      align-items: end;
      padding: 120px 10vw 40px;
    }

    .work-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: transform 0.35s ease;
    }

    .work-card:hover {
      transform: translateY(-8px);
    }

    .work-title {
      order: 1;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: -0.03em;
      margin-bottom: 28px;
      transition: color 0.25s ease;
    }

    .work-card:hover .work-title {
      color: var(--blue);
    }

    .work-line {
      order: 2;
      width: 1px;
      height: 170px;
      background: var(--text);
      margin-bottom: 28px;
    }

    .work-image {
      order: 3;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: #ded8cf;
      overflow: hidden;
      box-shadow: 18px 22px 26px rgba(31, 31, 31, 0.18);
      transition: transform 0.35s ease;
    }

    .work-card:hover .work-image {
      transform: scale(1.04);
    }

    .work-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%);
      transition: filter 0.35s ease;
    }

    .work-card:hover .work-image img {
      filter: grayscale(0%);
    }

    @media (max-width: 900px) {
      header {
        padding: 20px;
      }

      section {
        padding: 36px 20px 72px;
      }

      .section-header {
        display: block;
      }

      .section-note {
        margin-top: 16px;
        transform: none;
      }

      .work-grid {
        grid-template-columns: 1fr;
        gap: 72px;
        padding: 60px 0 20px;
      }

      .work-line {
        height: 120px;
      }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">Arisa Teriyapirom</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="works.html">Works</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section>
      <div class="section-header">
        <h1>Works.</h1>
        <p class="section-note">
          Explore selected works across architecture, spatial urban<br>
          research, graphic, product, and exhbibition design.
        </p>
      </div>

      <div class="work-grid">
        <a href="architectural-design.html" class="work-card">
          <h2 class="work-title">Architectural<br>Design</h2>
          <div class="work-line"></div>
          <div class="work-image">
            <img src="images/architectural_design_main.png" alt="Architectural Design graphic">
          </div>
        </a>

        <a href="spatial-urban-research.html" class="work-card">
          <h2 class="work-title">Spatial Urban<br>Research</h2>
          <div class="work-line"></div>
          <div class="work-image">
            <img src="images/spatial_urban_research_main.jpg" alt="Spatial Urban Research graphic">
          </div>
        </a>

        <a href="graphic-design.html" class="work-card">
          <h2 class="work-title">Visual<br>Communication</h2>
          <div class="work-line"></div>
          <div class="work-image">
            <img src="images/graphic_design_main.png" alt="Graphic Design graphic">
          </div>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
